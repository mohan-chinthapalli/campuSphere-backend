# ============================================================
# Railway deployment configuration for CampuSphere backend
# Railway Root Directory is set to /CampuSphere in the dashboard.
# All paths here are relative to /CampuSphere.
# ============================================================

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/actuator/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
