# ============================================================
# CampuSphere - Application Configuration
# ============================================================
spring.application.name=CampuSphere
server.port=${PORT:8080}

# ============================================================
# Database
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusphere?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================================
# Flyway Migrations
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ============================================================
# JWT Security
# ============================================================
app.jwt.secret=${JWT_SECRET:campusphere-super-secret-key-change-this-in-production-must-be-at-least-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:5173}

# ============================================================
# AI (Demo mode - no real LLM connected)
# ============================================================
app.ai.demo-mode=true
app.ai.demo-delay-ms=800

# ============================================================
# OpenAPI / Swagger
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ============================================================
# Logging
# ============================================================
logging.level.com.major.CampuSphere=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
