# ============================================================
# Test profile — H2 in-memory, Flyway disabled, DDL managed by Hibernate
# ============================================================
spring.datasource.url=jdbc:h2:mem:campusphere_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable Flyway for tests — Hibernate manages schema via ddl-auto
spring.flyway.enabled=false

app.jwt.secret=test-secret-key-for-unit-tests-only-must-be-at-least-32-characters-long
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000
app.cors.allowed-origins=http://localhost:3000
app.ai.demo-mode=true
app.ai.demo-delay-ms=0

logging.level.com.major.CampuSphere=WARN
logging.level.org.springframework.security=WARN
