version: "3.9"

# ============================================================
# CampuSphere — Development Docker Compose
# Database: Supabase PostgreSQL (external — no local DB container)
# Usage: docker-compose up -d
# Requires: .env file with SUPABASE_DB_URL, SUPABASE_DB_USERNAME,
#           SUPABASE_DB_PASSWORD, JWT_SECRET set.
# ============================================================

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusphere-backend
    restart: unless-stopped
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      SUPABASE_DB_USERNAME: ${SUPABASE_DB_USERNAME}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-campusphere-dev-secret-change-in-production-32chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
